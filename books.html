<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Book Information</title>
    </head>

    <body>
        <h1>Book Information</h1>

        <div id="bookInfo"></div>
        <script>
            async function loadBooks() {
                const bookInfo = document.getElementById("bookInfo");

                try{
                    const response = await fetch("books.json");

                    if (!response.ok){
                        throw new Error("Unable to load books.json");
                    }

                    const data = await response.json();

                    const title = document.createElement("p");
                    title.textContent = data.books[0].title;
                    bookInfo.appendChild(title);

                    const author = document.createElement("p");
                    author.textContent = data.books[1].author;
                    bookInfo.appendChild(author);

                    data.books.forEach(book => {
                        const genre = document.createElement("p");
                        genre.textContent = book.title + " - " + book.genres.join(", ");

                        bookInfo.appendChild(genre);
                    });
                } catch (error) {
                    bookInfo.textContent = "Error: Unable to retrieve book information.";
                }
            }

            loadBooks();

        </script>
    </body>
</html>
